# deny.toml — cargo-deny configuration (licenses + advisories; bans/sources
# run on cargo-deny's own defaults, no section needed for either today)
# Task #1881: allow `cargo deny check licenses` to pass for this repo.
#
# Green-tier licenses permitted here:
#   MIT, Apache-2.0 (+ LLVM-exception), BSD variants, ISC, CC0-1.0,
#   Unicode-3.0, PostgreSQL, Unlicense, Zlib, 0BSD.
#
# OR-expressions in the dependency tree are satisfied by a permissive
# alternative already in `allow`, so these identifiers are intentionally
# absent: copyleft GPL-2.0-only and LGPL-2.1-or-later (resolved via a
# Green-tier alternative), and BSL-1.0 (itself permissive — its crates
# ryu/whoami resolve via Apache-2.0/MIT).

[licenses]
# Confidence threshold for license-text inference (0.8 is a reasonable
# balance between false-positives and missing detections).
confidence-threshold = 0.8

allow = [
    # MIT family
    "MIT",
    "MIT-0",

    # Apache family
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",

    # BSD family
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-1-Clause",
    "0BSD",

    # Other permissive
    "ISC",  # Green; forward-looking — not in the resolved tree yet (#1881)
    "CC0-1.0",
    "Unlicense",
    "Zlib",

    # Unicode license (unicode-ident, icu_* crates — appears in AND expressions)
    "Unicode-3.0",

    # PostgreSQL license (postgresql_embedded/archive/extensions — appears in AND expressions)
    "PostgreSQL",
]

# Task #3566 — advisory scan, wired into the `verify-advisories` gate (justfile).
# Measurement detail (how each fact below was established) lives in the
# landing commit message, not here — this comment states what a future
# editor of this section needs, not how it was found.
#
# cargo-deny 0.19.0 removed `vulnerability`, `notice` and `severity-threshold`
# as config keys (hard "this key has been removed" error,
# EmbarkStudios/cargo-deny#611). A vulnerability is denied unconditionally
# regardless, so dropping that key costs nothing; `notice`-only advisories
# have no live check at all.
#
# `unsound` and `unmaintained` are NOT deprecated — both are live SCOPE
# filters (`all`/`workspace`/`transitive`/`none`, not a severity level); with
# either key omitted, this cargo-deny build reports neither error nor
# warning for an advisory in that category. Set to `all` so a RustSec
# advisory in either informational category denies with the same force as a
# vulnerability, not just `yanked`. ⚠ Consequence: `unmaintained` advisories
# usually have no fixed version, so this can turn the gate red on an
# UNCHANGED tree — the fix is a maintainer call (replace or ignore-with-
# reason), not a patch bump. `yanked` is set explicitly rather than relying
# on the tool's own default, for the same "deny it like a vulnerability"
# reason.
#
# ⛔ Scope limit: cargo-deny checks only the FEATURE-RESOLVED dependency
# graph, not every Cargo.lock entry. `rustls` and `spin` are both
# locked-but-never-compiled in this workspace and this gate never reports on
# either, at any version — a crate that starts being compiled is picked up
# automatically with no config change needed here; the residual is no signal
# while it stays uncompiled — nothing re-checks either on a schedule. Their
# advisories (RUSTSEC-2026-0285, -0346, -0348 and -0349 for rustls, all
# patched at >=0.23.46; the yank for spin) were verified clear at 0.23.46 /
# 0.9.9 by direct reads in this change (the advisory-db files and the
# crates.io index cache), not by `cargo deny`.
[advisories]
yanked = "deny"
unsound = "all"
unmaintained = "all"

# A stale ignore — one whose ID no longer matches anything in the tree,
# because the advisory cleared or the ID was mistyped — fails the gate
# instead of sitting here looking honoured forever.
unused-ignored-advisory = "deny"

# No advisory exceptions. Every advisory was cleared by a version bump rather
# than ignored: the patch-level ones in #3566 (crossbeam-epoch, rustls, h2,
# anyhow, event-listener, chacha20, spin) and the four wasmtime ones by the
# wasmtime 48.x bump in #3646, which also keeps component-model async off
# (libs/mnemra-host/Cargo.toml, plugin/limits.rs; tests/component_async_rejected.rs).
ignore = []
