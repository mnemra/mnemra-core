# deny.toml — cargo-deny configuration (licenses + advisories; bans/sources
# run on cargo-deny's own defaults, no section needed for either today)
# Task #1881: allow `cargo deny check licenses` to pass for this repo.
#
# Green-tier licenses permitted here:
#   MIT, Apache-2.0 (+ LLVM-exception), BSD variants, ISC, CC0-1.0,
#   Unicode-3.0, PostgreSQL, Unlicense, Zlib, 0BSD.
#
# OR-expressions in the dependency tree are satisfied by a permissive
# alternative already in `allow`, so these identifiers are intentionally
# absent: copyleft GPL-2.0-only and LGPL-2.1-or-later (resolved via a
# Green-tier alternative), and BSL-1.0 (itself permissive — its crates
# ryu/whoami resolve via Apache-2.0/MIT).

[licenses]
# Confidence threshold for license-text inference (0.8 is a reasonable
# balance between false-positives and missing detections).
confidence-threshold = 0.8

allow = [
    # MIT family
    "MIT",
    "MIT-0",

    # Apache family
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",

    # BSD family
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-1-Clause",
    "0BSD",

    # Other permissive
    "ISC",  # Green; forward-looking — not in the resolved tree yet (#1881)
    "CC0-1.0",
    "Unlicense",
    "Zlib",

    # Unicode license (unicode-ident, icu_* crates — appears in AND expressions)
    "Unicode-3.0",

    # PostgreSQL license (postgresql_embedded/archive/extensions — appears in AND expressions)
    "PostgreSQL",
]

# Task #3566 — advisory scan, wired into the `verify-advisories` gate (justfile).
# Measurement detail (how each fact below was established) lives in the
# landing commit message, not here — this comment states what a future
# editor of this section needs, not how it was found.
#
# cargo-deny 0.19.0 removed `vulnerability`, `notice` and `severity-threshold`
# as config keys (hard "this key has been removed" error,
# EmbarkStudios/cargo-deny#611). A vulnerability is denied unconditionally
# regardless, so dropping that key costs nothing; `notice`-only advisories
# have no live check at all.
#
# `unsound` and `unmaintained` are NOT deprecated — both are live SCOPE
# filters (`all`/`workspace`/`transitive`/`none`, not a severity level); with
# either key omitted, this cargo-deny build reports neither error nor
# warning for an advisory in that category. Set to `all` so a RustSec
# advisory in either informational category denies with the same force as a
# vulnerability, not just `yanked`. ⚠ Consequence: `unmaintained` advisories
# usually have no fixed version, so this can turn the gate red on an
# UNCHANGED tree — the fix is a maintainer call (replace or ignore-with-
# reason), not a patch bump. `yanked` is set explicitly rather than relying
# on the tool's own default, for the same "deny it like a vulnerability"
# reason.
#
# ⛔ Scope limit: cargo-deny checks only the FEATURE-RESOLVED dependency
# graph, not every Cargo.lock entry. `rustls` and `spin` are both
# locked-but-never-compiled in this workspace and this gate never reports on
# either, at any version — a crate that starts being compiled is picked up
# automatically with no config change needed here; the residual is no signal
# while it stays uncompiled — nothing re-checks either on a schedule. Their
# advisories (RUSTSEC-2026-0285, -0346, -0348 and -0349 for rustls, all
# patched at >=0.23.46; the yank for spin) were verified clear at 0.23.46 /
# 0.9.9 by direct reads in this change (the advisory-db files and the
# crates.io index cache), not by `cargo deny`.
[advisories]
yanked = "deny"
unsound = "all"
unmaintained = "all"

# A stale ignore — one whose ID no longer matches anything in the tree,
# because the advisory cleared or the ID was mistyped — fails the gate
# instead of sitting here looking honoured forever.
unused-ignored-advisory = "deny"

# Three exceptions, all interim (#4017). zip 8.x carries GHSA-vv5m-jxxh-4627,
# GHSA-4v9h-p7m9-rh26 and GHSA-4684-h2q9-2vcp (zip-rs/zip2#1075), which RustSec
# imported as RUSTSEC-2026-0367 / -0368 / -0369. They are ID-scoped: an `id`
# ignore has no version field, so it silences the advisory for any affected zip
# version in the graph, and nothing bans a second zip from arriving.
# Extended to the IDs on Peter's ruling of 2026-10-18 ("extend it for now").
# Exit: remove the embedded-Postgres crates (#4018). `unused-ignored-advisory`
# fails the gate once zip leaves the graph or all three are fixed, so ALL THREE
# lines must be deleted in that change.
# The zip owner yanked 8.6.0 on 2026-10-16 and un-yanked it the same day; the
# other 8.x versions were un-yanked on 2026-10-17, and on 2026-10-18 the
# maintainer repealed the policy of yanking known-insecure versions
# (zip-rs/zip2#1075). The `zip@8.6.0` crate ignore went stale
# (`yanked-not-detected`) and was removed. Nothing yanks zip now, so this gate
# no longer sees a vulnerable zip through `yanked`.
# NOT SEEN BY THIS GATE: GHSA-m665-v7pm-7grj, critical, "Zip Cloaking" parser
# differential, published on the zip repo 2026-10-17, affects zip <= 9.0.4
# (8.6.0 included), patched only in 9.0.5. It is in neither RustSec nor GitHub's
# global advisory database, so neither this gate nor Dependabot reports it.
# Not reachable here (MEASURED for postgresql_* 0.20.4): it concerns
# ZipStreamReader and ZipArchive disagreeing on headers, and the only caller,
# postgresql_archive-0.20.4 src/extractor/zip_extractor.rs (reached through the
# portal_corp extension in postgresql_extensions 0.20.4), walks
# ZipArchive::by_index and writes contents by basename; it uses neither
# ZipStreamReader nor extract(). "No other zip caller in the graph" is
# INFERRED. All of this goes stale on any postgresql_* bump.
# Trip-wire: when RustSec imports GHSA-m665-v7pm-7grj this gate goes red on an
# unchanged tree. That needs a ruling from Peter: a fourth id ignore, or the
# #4018 exit.
# Fix target: zip >= 9.0.5 at minimum, with further issues reported against
# 9.0.5 (zip-rs/zip2#1075); that needs postgresql_archive off ^8.
# PARKED: the maintainer offered backports to old majors (zip-rs/zip2#1075). If
# a patched 8.x ships, `cargo update -p zip` within ^8 would fix it and the
# ignores turn unused, but `unused-ignored-advisory` fires only once all three
# are fixed, so "blocked until postgresql_archive moves off ^8" can go false
# with no signal. Check by hand at the maintainer's stated 2026-10-30 backport
# date.
# Every other advisory was cleared by a version bump rather than ignored: the
# patch-level ones in #3566 (crossbeam-epoch, rustls, h2, anyhow,
# event-listener, chacha20, spin) and the four wasmtime ones by the wasmtime
# 48.x bump in #3646, which also keeps component-model async off
# (libs/mnemra-host/Cargo.toml, plugin/limits.rs; tests/component_async_rejected.rs).
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0, GHSA-vv5m-jxxh-4627; zip >=9.0.0 needs postgresql_archive off ^8; interim per 2026-10-18 ruling, exit is #4018" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0, GHSA-4v9h-p7m9-rh26; zip >=9.0.0 needs postgresql_archive off ^8; interim per 2026-10-18 ruling, exit is #4018" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0, GHSA-4684-h2q9-2vcp; zip >=9.0.0 needs postgresql_archive off ^8; interim per 2026-10-18 ruling, exit is #4018" },
]

# #3842 — wasmtime's WASI host crates are banned, as a mechanism. The host-fn
# allowlist (P-0003, R-0003-b) mediates only `mnemra:host/*` imports; every
# other import of a plugin component (the `wasi:*` set the wasm32-wasip2 adapter
# pulls in) is satisfied by an inert trap-stub in `component::build_linker`. A
# `wasmtime_wasi::...::add_to_linker` call added after those stubs would shadow
# them (allow_shadowing is on) with real filesystem/clock/stdio capability,
# bypassing the manifest, and no WIT or test would change. Linking a WASI host
# is a design decision, not a dependency bump: lift this ban only together with
# an allowlist that covers the wasi: namespace.
[bans]
deny = [
    { crate = "wasmtime-wasi" },
    { crate = "wasmtime-wasi-io" },
    { crate = "wasmtime-wasi-http" },
]
