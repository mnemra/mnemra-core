[workspace]
resolver = "3"
members = [
    "libs/mnemra-host",
    "cmd/mnemra",
    "cmd/sign-ceremony",
    "plugins/mnemra-echo",
]
default-members = [
    "cmd/mnemra",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Peter Manahan"]
license = "Apache-2.0"

[workspace.lints.rust]
# #2550 (narrowed by maintainer ruling): unsafe_code only, not the full strict set.
# `deny`, not `forbid`: forbid cannot be locally overridden, and the few
# existing sites carry a scoped `#[allow(unsafe_code)]` with a SAFETY note.
# mnemra-echo has a crate-root allow with a reason comment instead (wit_bindgen glue).
unsafe_code = "deny"

[workspace.dependencies]
# Task 23: official MCP server SDK (rmcp). Pinned at 3.7; no http/streamable-http
# feature (R-0010-e). Server runtime uses server+transport-io; the client
# feature is added only as a dev-dependency for in-process test transports.
rmcp = { version = "3.7", features = ["server", "transport-io"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
wit-bindgen = "0.57"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Build cost (#4107): third-party crates carry no debuginfo; workspace members
# keep the default debug = 2. Without this, registry crates were compiled twice
# -- once debug-off (the build-script / proc-macro side, where build-override
# defaults to debug = false) and once debug = 2 -- doubling their compile time.
# Trade: a debugger or backtrace has no line info inside a dependency.
[profile.dev.package."*"]
debug = false
