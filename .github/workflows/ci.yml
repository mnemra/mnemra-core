name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-authority floor (brain #3597 Q3 / #3616): every step across all
# three jobs below — checkout, the toolchain install actions, and every
# `just`-invoked gate — only ever reads this repository's contents. None
# uploads or downloads an artifact, posts a PR comment, creates a check
# run, or writes a package. (actions/cache and Swatinem/rust-cache are
# believed to use their own internal cache-service token rather than this
# one — inherited knowledge, not verified against a live source this
# session; watch the first post-landing run for a cache-permission
# surprise if that's wrong.) Set at the workflow level rather than per job
# because all three jobs need the exact same floor (one declaration, not
# three copies that could drift).
#
# This block is a NARROWING, not a restatement of today's ambient
# default: the repo's `default_workflow_permissions` is currently `read`
# (confirmed via `gh api repos/mnemra/mnemra-core/actions/permissions/
# workflow`, 2026-09-15), which grants read access across EVERY scope
# (issues, pull-requests, checks, actions, packages, ...) — not just
# `contents`. An explicit `permissions:` block sets every scope it does
# not list to `none`, so this pins `contents: read` and drops every other
# scope to no-access, tighter than the ambient default rather than merely
# recording it. It also stops the effective permission from depending on
# a mutable org/repo setting nobody here controls, and makes the floor
# reviewable in the workflow file itself. A job that genuinely needs more
# (e.g. a future job that comments on a PR) declares its own
# `permissions:` override — do not widen this block for it.
permissions:
  contents: read

# Coverage sharding (R-0093-R-0098, docs/specs/2026-07-15-ci-coverage-shard.md):
# the CI coverage gate intermittently failed with "No space left on device"
# on GitHub's mixed hosted-runner fleet — the workflow cannot select which
# disk-size variant it draws, and the instrumented binary set `cargo
# llvm-cov` builds was the dominant disk consumer of the whole run. Fix
# (Shape B, LOCKED — see the spec's "load-bearing decision" section):
# coverage runs as its own separate jobs below (coverage-pg, coverage-rest),
# each on a fresh runner disk, each emitting its own per-shard number. The
# main "CI gates" job no longer runs coverage at all (`just ci
# _ci-verify-chain-nocoverage`) — every other gate (type/lint/test/
# test-hooks/build/smoke/signing-root) is unchanged (R-0098). No billed or
# larger-disk runners, no upload-artifact/download-artifact Action added
# (R-0097).
jobs:
  ci:
    name: CI gates
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Free runner disk space
        run: |
          echo "=== disk before ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost /usr/lib/jvm /usr/local/share/powershell /usr/share/swift /usr/local/share/chromium /usr/local/lib/node_modules /opt/microsoft /opt/google /usr/lib/firefox
          sudo docker image prune --all --force
          echo "=== disk after ==="
          df -h /

      # This job no longer runs coverage (moved to the coverage-pg /
      # coverage-rest jobs, R-0094), so it needs only clippy + rustfmt for
      # verify-lint and the wasm target for the plugin build — NOT
      # llvm-tools-preview (coverage-only tooling now lives in the shard jobs).
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Compute pinned-artifact cache-key suffix
        id: pin-hash
        # Cache-key mechanism (brain #3597 Q4 / #3616) — the theseus cache
        # key must change whenever the pinned Postgres/pgvector version or
        # any KNOWN_GOOD_HASHES entry changes, or a bump silently restores a
        # now-wrong-version cache forever (actions/cache never overwrites an
        # existing key, so a stale key never self-heals — it cold-downloads
        # the NEW version on every run from then on, permanently, since the
        # save-on-miss path keeps targeting the same unchanged key). A plain
        # `hashFiles('.../engine.rs')` would work but churns the cache on
        # every doc-comment edit to that ~850-line file — most edits there
        # have nothing to do with the pin, and that's unacceptable churn for
        # a file this size. Smallest mechanism instead: hash only the lines
        # that ARE the pin — the two version consts and every `sha256:`
        # field in KNOWN_GOOD_HASHES (verified this matches exactly those
        # seven lines and no doc-comment text: `grep -nE 'pub const
        # (EMBEDDED_PG_VERSION|PGVECTOR_VERSION)|sha256:'
        # libs/mnemra-host/storage/postgres/engine.rs`) — and use that as
        # the key suffix. `set -euo pipefail` makes this fail LOUD, not
        # silently produce a hash-of-nothing, if the grep pattern ever stops
        # matching (e.g. the pin moves to a different file): pipefail
        # propagates grep's own exit 1 through `sha256sum`/`cut` even though
        # neither of those fails on empty input.
        #
        # Deliberately NO `restore-keys:` (brain #3597 review, 2026-09-15): a
        # prefix-match fallback could restore a cache built for a DIFFERENT
        # pinned version, and `verify_pinned_artifacts()` is fail-shut — a
        # stale restore doesn't just miss a speed-up, it hash-mismatches and
        # turns CI red for what reads as a regression but is actually a
        # cache-staleness artifact. Exact-match-or-miss only.
        run: |
          set -euo pipefail
          hash="$(grep -E 'pub const (EMBEDDED_PG_VERSION|PGVECTOR_VERSION)|sha256:' libs/mnemra-host/storage/postgres/engine.rs | sha256sum | cut -d' ' -f1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Cache Postgres binaries (theseus)
        uses: actions/cache@v4
        with:
          path: ~/.theseus
          key: theseus-pg-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin-hash.outputs.hash }}

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      # Coverage moved to its own jobs below (coverage-pg / coverage-rest,
      # R-0094) — this job runs every other gate (R-0098). No disk probe
      # needed here: this job is no longer coverage-instrumented, so it never
      # carried the disk-appetite that made the probe (R-0093) necessary.
      - name: Run CI gates (non-coverage)
        run: just ci _ci-verify-chain-nocoverage

      - name: Docs drift gate
        run: just docs-check

  coverage-pg:
    name: Coverage — PG shard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Free runner disk space
        run: |
          echo "=== disk before ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost /usr/lib/jvm /usr/local/share/powershell /usr/share/swift /usr/local/share/chromium /usr/local/lib/node_modules /opt/microsoft /opt/google /usr/lib/firefox
          sudo docker image prune --all --force
          echo "=== disk after ==="
          df -h /

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Compute pinned-artifact cache-key suffix
        id: pin-hash
        # Same mechanism as the `ci` job above (brain #3597 Q4 / #3616) —
        # hashes only the version-pin and sha256-pin lines in engine.rs, so
        # the cache key changes exactly when the pin changes, not on every
        # doc edit to that file. No restore-keys: a stale prefix-match would
        # hash-mismatch (fail-shut) and read as a regression, not a cache
        # issue.
        run: |
          set -euo pipefail
          hash="$(grep -E 'pub const (EMBEDDED_PG_VERSION|PGVECTOR_VERSION)|sha256:' libs/mnemra-host/storage/postgres/engine.rs | sha256sum | cut -d' ' -f1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Cache Postgres binaries (theseus)
        uses: actions/cache@v4
        with:
          path: ~/.theseus
          key: theseus-pg-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin-hash.outputs.hash }}

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.6

      # Roulette-detector probe (R-0093): present in every coverage-
      # instrumented job. Logs disk-TOTAL (classifies the smaller-/larger-
      # disk fleet variant this job drew) plus periodic avail samples for /
      # and /mnt, so this job's true minimum headroom is readable from the
      # log alone — the load-bearing evidence that this shard clears the
      # margin floor even on a smaller-variant draw (R-0094 AC, Verify
      # Contract item 2). Diagnostic only — changes no gate outcome.
      - name: Disk-total + headroom probe (R-0093)
        run: |
          echo "[disk-probe] runner disk-total:"
          df -h / 2>/dev/null || true
          if mountpoint -q /mnt 2>/dev/null; then
            df -h /mnt 2>/dev/null || true
          else
            echo "[disk-probe] /mnt is not a distinct mount on this runner"
          fi

      - name: Run coverage shard (PG)
        run: |
          probe() {
            while true; do
              ts="$(date -u +%T)"
              echo "[disk-probe] ${ts} avail /=$(df --output=avail -h / | tail -1 | tr -d ' ')"
              if mountpoint -q /mnt 2>/dev/null; then
                echo "[disk-probe] ${ts} avail /mnt=$(df --output=avail -h /mnt | tail -1 | tr -d ' ')"
              fi
              sleep 15
            done
          }
          probe &
          trap 'kill %1 2>/dev/null || true' EXIT
          just verify-coverage-pg

  coverage-rest:
    name: Coverage — rest shard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Free runner disk space
        run: |
          echo "=== disk before ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost /usr/lib/jvm /usr/local/share/powershell /usr/share/swift /usr/local/share/chromium /usr/local/lib/node_modules /opt/microsoft /opt/google /usr/lib/firefox
          sudo docker image prune --all --force
          echo "=== disk after ==="
          df -h /

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Compute pinned-artifact cache-key suffix
        id: pin-hash
        # Same mechanism as the `ci` job above (brain #3597 Q4 / #3616) —
        # hashes only the version-pin and sha256-pin lines in engine.rs, so
        # the cache key changes exactly when the pin changes, not on every
        # doc edit to that file. No restore-keys: a stale prefix-match would
        # hash-mismatch (fail-shut) and read as a regression, not a cache
        # issue.
        run: |
          set -euo pipefail
          hash="$(grep -E 'pub const (EMBEDDED_PG_VERSION|PGVECTOR_VERSION)|sha256:' libs/mnemra-host/storage/postgres/engine.rs | sha256sum | cut -d' ' -f1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      # Postgres binary cache (theseus). `-p mnemra-host --lib` includes
      # exactly one live-DB test (write_path.rs,
      # clean_write_commits_state_and_flushes_exactly_one_audit_row —
      # deliberately the ONLY `--lib` test that boots an engine) that calls
      # `EmbeddedEngine::start()`. Before brain #3597's fix, this restore was
      # load-bearing for correctness: `verify_pinned_artifacts()` hash-checked
      # the pgvector shared library right after `setup()`, before
      # `install_extension()` had ever written it, so a cold `~/.theseus` with
      # no prior PG-touching test in this job to have installed pgvector first
      # failed with a hash-pin "no such file" error. #3597 split that check in
      # two — the pgvector library is now verified after the install-or-skip
      # step, not before it — so `start()` succeeds from a genuinely cold
      # `~/.theseus` (it installs pgvector itself), and this ordering bug no
      # longer makes the restore load-bearing. It still is for a different
      # reason: this job's `env:` has no `GITHUB_TOKEN` (unlike the `ci` job
      # above, which has carried one at the job level since 2026-06-12,
      # c11ae02 — three months before #3597 and the `verify-cold-start` gate
      # existed, added generally to keep any PG-touching step in that job
      # under the authenticated rate limit, not specifically for cold-start),
      # so a cache miss here means an unauthenticated cold download of both
      # artifacts from GitHub, which risks the unauthenticated API rate limit
      # on a shared runner pool — restoring the cache avoids that path entirely,
      # not just its round-trip cost. Found via CI failure on this job
      # (dispatch 1626): the pre-shard single job never hit the ordering bug
      # because its PG_TEST_FLAGS pass always ran before `-p mnemra-host
      # --lib` in the same process/filesystem.
      - name: Cache Postgres binaries (theseus)
        uses: actions/cache@v4
        with:
          path: ~/.theseus
          key: theseus-pg-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin-hash.outputs.hash }}

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.6

      # Roulette-detector probe (R-0093) — same rationale as the coverage-pg
      # job above; present in every coverage-instrumented job.
      - name: Disk-total + headroom probe (R-0093)
        run: |
          echo "[disk-probe] runner disk-total:"
          df -h / 2>/dev/null || true
          if mountpoint -q /mnt 2>/dev/null; then
            df -h /mnt 2>/dev/null || true
          else
            echo "[disk-probe] /mnt is not a distinct mount on this runner"
          fi

      - name: Run coverage shard (rest)
        run: |
          probe() {
            while true; do
              ts="$(date -u +%T)"
              echo "[disk-probe] ${ts} avail /=$(df --output=avail -h / | tail -1 | tr -d ' ')"
              if mountpoint -q /mnt 2>/dev/null; then
                echo "[disk-probe] ${ts} avail /mnt=$(df --output=avail -h /mnt | tail -1 | tr -d ' ')"
              fi
              sleep 15
            done
          }
          probe &
          trap 'kill %1 2>/dev/null || true' EXIT
          just verify-coverage-rest
